apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// The app ships with each Stitch release: its version is the repo's package.json version
// (0.3.0 → versionName "0.3.0", versionCode 300), so `npm run release` bumps both apps.
def stitchVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../../package.json')).version as String
def stitchVersionCode = stitchVersion.tokenize('.').collect { it.replaceAll('[^0-9].*', '') as int }.with { it[0] * 10000 + it[1] * 100 + it[2] }

// Release signing: android/keystore.properties (gitignored) points at the upload key.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }

android {
    namespace = "com.stitch.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.stitch.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode stitchVersionCode
        versionName stitchVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        // On-device AI runtimes (LiteRT-LM, ONNX Runtime + QNN, sherpa-onnx) ship native code per ABI; every phone
        // that can run them is arm64, so only package that ABI.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropsFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        jniLibs {
            // Extract the .so files to nativeLibraryDir (android:extractNativeLibs="true"): the Hexagon NPU skeleton
            // libraries (libQnnHtpV*Skel.so) are loaded onto the DSP by FastRPC from a real file path found through
            // ADSP_LIBRARY_PATH, and LiteRT-LM looks for its NPU dispatch library inside nativeLibraryDir.
            useLegacyPackaging = true
            // QNN's legacy HVX "DSP" backend (V66) is unused; the HTP (NPU) and GPU backends are kept.
            excludes += ['**/libQnnDsp.so', '**/libQnnDspV66Skel.so', '**/libQnnDspV66Stub.so']
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs += [new File(buildDir, 'generated/stitch-jni')]
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

apply from: 'native-deps.gradle'

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation project(':capacitor-android')

    // On-device AI (StitchDevice plugin)
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"
    implementation "com.google.ai.edge.litertlm:litertlm-android:$litertlmVersion"
    implementation "com.microsoft.onnxruntime:onnxruntime-android-qnn:$onnxruntimeQnnVersion"
    implementation "com.qualcomm.qti:qnn-runtime:$qnnRuntimeVersion"
    implementation files(stitchSherpaAar).builtBy('fetchSherpaOnnx')

    testImplementation "junit:junit:$junitVersion"
    // Real org.json for JVM unit tests (android.jar only has stubs).
    testImplementation "org.json:json:20250517"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
